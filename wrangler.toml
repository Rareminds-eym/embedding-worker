name = "embedding-worker-dev"
main = "src/index.ts"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 9004
inspector_port = 9230

[observability]
enabled = true

# ============================================================================
# DEV — wrangler deploy (default, no --env flag)
# Deploys as: embedding-worker-dev
# ============================================================================
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "dev"
ALLOWED_ORIGINS = "https://dev.skillpassports.com"

[[kv_namespaces]]
binding    = "EMBEDDING_KV"
id         = "8faee86f16cc49989fd17063d15c8929"
preview_id = "8faee86f16cc49989fd17063d15c8929"

# Native rate limiting — counters are cached per Cloudflare location and updated
# asynchronously. namespace_id is a positive integer you choose. period must be 10 or 60.
# The key passed at runtime is tenantId:endpoint.
[[unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1001"
simple       = { limit = 120, period = 60 }

# KV key schema:
#   tenant:<id>                        → TenantConfig JSON
#   api_keys:<sha256>                  → ApiKeyRecord JSON
#   tenant_keys:<tenantId>:<sha256>    → "1" (reverse index for tenant key deletion)
#   delete:tenant:<id>                 → deletion-in-progress flag (TTL 300s)

# wrangler secret put ADMIN_KEY
# wrangler secret put GEMINI_API_KEY

# ============================================================================
# STAGING  →  wrangler deploy --env staging
# Deploys as: embedding-worker-staging
# ============================================================================
[env.staging]
name = "embedding-worker-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://stag.skillpassports.com"

[[env.staging.kv_namespaces]]
binding = "EMBEDDING_KV"
id = "87fb2ee71c094bf58302e46da00c0f7e"

[[env.staging.unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1003"
simple       = { limit = 120, period = 60 }

# wrangler secret put ADMIN_KEY      --env staging
# wrangler secret put GEMINI_API_KEY --env staging

# ============================================================================
# DEMO  →  wrangler deploy --env demo
# Deploys as: embedding-worker-demo
# ============================================================================
[env.demo]
name = "embedding-worker-demo"

[env.demo.ai]
binding = "AI"

[env.demo.vars]
ENVIRONMENT = "demo"
ALLOWED_ORIGINS = "https://demo.skillpassports.com"

[[env.demo.kv_namespaces]]
binding = "EMBEDDING_KV"
id = "6dbc06e45b654ad58a8d1a02f8713b15"

[[env.demo.unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
# ⚠️ Replace with demo rate limiter namespace ID
namespace_id = "10042"
simple       = { limit = 120, period = 60 }

# wrangler secret put ADMIN_KEY      --env demo
# wrangler secret put GEMINI_API_KEY --env demo

# ============================================================================
# PRODUCTION  →  wrangler deploy --env production
# Deploys as: embedding-worker-production
# ============================================================================
[env.production]
name = "embedding-worker-production"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://skillpassport.com,https://www.skillpassport.com"

[[env.production.kv_namespaces]]
binding = "EMBEDDING_KV"
id = "3cf92ef89a5b43bb9d420169cd68df22"

[[env.production.unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1004"
simple       = { limit = 120, period = 60 }

# wrangler secret put ADMIN_KEY      --env production
# wrangler secret put GEMINI_API_KEY --env production
