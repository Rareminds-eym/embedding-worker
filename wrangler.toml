name = "embedding-worker"
main = "src/index.ts"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 9004
inspector_port = 9231

[observability]
enabled = true

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://skillpassport.com,https://www.skillpassport.com"

[[kv_namespaces]]
binding = "EMBEDDING_KV"
id = "3cf92ef89a5b43bb9d420169cd68df22"

[[unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1004"
simple       = { limit = 120, period = 60 }

# wrangler secret put ADMIN_KEY
# wrangler secret put GEMINI_API_KEY
# ⚠️ EMBEDDING_KV id above is a placeholder — replace with production KV namespace id before deploying
